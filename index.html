<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="vinyl-icon.svg" type="image/x-svg">
    <title>Album Viewer</title>
</head>
<body>
    <div class="input">
        <div class="search-field artist-field">
            <input type="search"
            placeholder="Artist Name"
            id="searchArtist"
            class="search"
            aria-autocomplete="list"
            aria-controls="artistSuggestionMenu"
            autocomplete="off">
            <datalist id="suggestartist"></datalist>
            <div class="suggestion-menu" id="artistSuggestionMenu" role="listbox" aria-label="Artist suggestions"></div>
        </div>
        <div class="search-field album-field">
            <input type="search"
            placeholder="Search Albums, EP, Singles"
            id="searchAlbum"
            class="search"
            aria-autocomplete="list"
            aria-controls="albumSuggestionMenu"
            autocomplete="off">
            <datalist id="suggestalbum"></datalist>
            <div class="suggestion-menu" id="albumSuggestionMenu" role="listbox" aria-label="Album suggestions"></div>
        </div>
        <button type="submit" id="search" aria-label="Search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <circle class="search-icon-ring" cx="10.5" cy="10.5" r="6.5"></circle>
                <line class="search-icon-handle" x1="15.5" y1="15.5" x2="21" y2="21"></line>
            </svg>
        </button>
    </div>
    <div class="album-title"></div>
    <div class="vinyl-track">
        <div class="spinning-vinyl">
            <div class="vinyl-record">
                <div class="vinyl-label"></div>
            </div>
            <div class="album-jacket">
                <img alt="Surreal Album Art" class="cover-image" src="music-note-circle-svgrepo-com.svg">
            </div>
        </div>
        <div class="track-list-container"><h1>Tracklist</h1></div>
            <button type="submit" id="openalbumdetail">Album Details</button>
            <div class="albumdetails" id="albumdetails">

            </div>
    </div>
    <script src="https://unpkg.com/node-vibrant@3.1.6/dist/vibrant.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
